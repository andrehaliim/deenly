<!doctype html>
<!--
  Promo frame rendered by frame.py at 1080x1920.
  Placeholders: {{fonts}}, {{shot}}, {{title}}, {{subtitle}}, {{crop}}.
  {{crop}} is the status bar height as a percentage of the screenshot width,
  so the negative margin below trims it off the top.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Manrope; font-weight: 700; src: url("{{fonts}}/Manrope-Bold.ttf"); }
@font-face { font-family: Manrope; font-weight: 500; src: url("{{fonts}}/Manrope-Medium.ttf"); }

* { margin: 0; box-sizing: border-box; }

html, body { width: 1080px; height: 1920px; overflow: hidden; }

body {
  font-family: Manrope, sans-serif;
  background:
    radial-gradient(900px 700px at 85% 8%, rgba(197, 160, 89, 0.28), transparent 60%),
    radial-gradient(800px 900px at 0% 100%, rgba(0, 117, 106, 0.55), transparent 65%),
    linear-gradient(165deg, #00594B 0%, #004D40 45%, #00332B 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.caption { padding: 120px 80px 0; text-align: center; }

h1 { font-size: 76px; font-weight: 700; line-height: 1.1; letter-spacing: -1px; }

p { margin-top: 26px; font-size: 36px; font-weight: 500; line-height: 1.35; color: #E6D5B8; }

.phone {
  margin-top: 90px;
  width: 760px;
  padding: 22px;
  border-radius: 92px;
  background: #0B0F0E;
  box-shadow: 0 0 0 3px #2A3A36, 0 60px 120px rgba(0, 0, 0, 0.45);
}

.screen { overflow: hidden; border-radius: 72px; }

.screen img { display: block; width: 100%; margin-top: calc(-1 * {{crop}}%); }
</style>
</head>
<body>
  <div class="caption">
    <h1>{{title}}</h1>
    <p>{{subtitle}}</p>
  </div>
  <div class="phone">
    <div class="screen"><img src="{{shot}}"></div>
  </div>
</body>
</html>
